[package]
name = "ironrdp-rdpeusb"
version = "0.1.0"
readme = "README.md"
description = "Remote Desktop Protocol: USB Devices Virtual Channel Extension implementation"
# Vendored copy of upstream ironrdp-rdpeusb (copied 2026-07-06 from
# Devolutions/IronRDP@879ffed, same rev as the git pins in the root Cargo.toml).
# Workspace-inherited fields are inlined below because we're not inside the
# IronRDP cargo workspace. The divergence: extend SupportedUsbVer with the USB
# 3.x versions (0x300/0x310/0x320) + make the decoder lenient on unknown values,
# so a modern USB-3 device's ADD_DEVICE caps parse instead of tearing down the
# session. See CLAUDE.md for the divergence log.
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

publish = false

[lib]
doctest = false
test = false

[features]
default = []
std = []

[dependencies]
# path = "../ironrdp-*" entries dropped — we live outside the upstream
# workspace, so cargo resolves these via the root macrdp Cargo.toml's
# [patch.crates-io] redirects (git pin to upstream master).
ironrdp-core = { version = "0.1", features = ["alloc"] } # public
ironrdp-pdu = { version = "0.7", features = ["alloc"] } # public
ironrdp-str = { version = "0.1" }
