[package]
name = "ironrdp-async"
version = "0.8.0"
readme = "README.md"
description = "Provides `Future`s wrapping the IronRDP state machines conveniently"
# Vendored copy of upstream ironrdp-async (copied 2026-08-05 from
# Devolutions/IronRDP@879ffed, the same rev as the git pins in the root Cargo.toml).
# Workspace-inherited fields are inlined below because we're not inside the IronRDP
# cargo workspace. The ONE divergence: a defensive guard in `Framed::read_by_hint`
# that rejects a zero-length UNMATCHED PDU instead of spinning forever at 100% CPU —
# an UNAUTH, pre-TLS remote DoS where a single 2-byte fast-path frame wedges the
# accept loop / whole server. This is macrdp's upstream PR #1556 (commit c541d09e);
# it complements upstream #1515's find_size hardening. Drop this vendor dir when the
# IronRDP pin bumps past both fixes. See CLAUDE.md.
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = false
test = false

[dependencies]
# path = "../ironrdp-*" entries dropped — we live outside the upstream workspace, so
# cargo resolves these via the root macrdp Cargo.toml's [patch.crates-io] redirects
# (git pin to upstream master).
ironrdp-connector = { version = "0.8" } # public
ironrdp-core = { version = "0.1", features = ["alloc"] } # public
ironrdp-pdu = { version = "0.7" } # public
tracing = { version = "0.1", features = ["log"] }
bytes = "1" # public

# [lints] workspace = true — inlined as empty since we're not in the workspace.
[lints]
